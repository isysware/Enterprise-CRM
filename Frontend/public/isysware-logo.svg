<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background linear gradient: deep midnight blue to vivid royal blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="35%" stop-color="#081A4C" />
      <stop offset="70%" stop-color="#0C349C" />
      <stop offset="100%" stop-color="#1E4ED8" />
    </linearGradient>

    <!-- Radial accent glow for vibrant lighting -->
    <radialGradient id="glowAccent" cx="80%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>

    <!-- Ultra-crisp inner rim border highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Outer Circle with Crisp Gradient & Glow -->
  <circle cx="256" cy="256" r="252" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="252" fill="url(#glowAccent)" />

  <!-- Ultra-Crisp Outer Rim Ring -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="url(#rimGrad)" stroke-width="3.5" />

  <!-- Main Brand Name: iSysware (Razor-sharp pure vector text without blur filters) -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="256" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif">
      <tspan fill="#FFFFFF" font-weight="900" font-size="88" letter-spacing="-2">iSys</tspan>
      <tspan fill="#FFFFFF" font-weight="500" font-size="88" letter-spacing="-1">ware</tspan>
    </text>

    <!-- Subtitle: SOFTWARE SOLUTIONS (Crisp, High-contrast, Legible at Small Scale) -->
    <text x="256" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#BAE6FD" letter-spacing="7">
      SOFTWARE SOLUTIONS
    </text>
  </g>
</svg>
